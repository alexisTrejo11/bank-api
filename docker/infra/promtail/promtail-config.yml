server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bank-file-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: bank-api
          log_type: compliance
          __path__: /var/log/bank/*.json
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger_name
      - labels:
          level:
          logger:

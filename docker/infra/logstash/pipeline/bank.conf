input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if ![level] {
    drop { }
  }
  if [level] in ["DEBUG", "TRACE"] {
    drop { }
  }
  if [logger_name] =~ /^org\.hibernate\./ {
    drop { }
  }
  if [logger_name] =~ /^org\.apache\.kafka\./ {
    drop { }
  }
  if [message] =~ /\/actuator\// or [path] =~ /\/actuator\// {
    drop { }
  }
  if [logger_name] == "ACCESS" or [logger_name] == "AUDIT" {
    mutate {
      add_tag => [ "compliance" ]
    }
  }
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "bank-logs-%{+YYYY.MM.dd}"
  }
}

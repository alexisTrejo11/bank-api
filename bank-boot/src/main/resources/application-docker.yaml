# Docker / deploy profile — all values from .env (see .env.example).
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
    username: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
    password: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:?Set SPRING_DATA_REDIS_HOST in .env}
      port: ${SPRING_DATA_REDIS_PORT:?Set SPRING_DATA_REDIS_PORT in .env}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:?Set SPRING_KAFKA_BOOTSTRAP_SERVERS in .env}
    admin:
      fail-fast: true
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:?Set SPRING_KAFKA_CONSUMER_GROUP_ID in .env}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  health:
    redis:
      enabled: true
    kafka:
      enabled: true

bank:
  logging:
    file:
      directory: ${BANK_LOGGING_DIRECTORY:/app/logs}
    loki:
      url: ${LOKI_URL:http://loki:3100/loki/api/v1/push}
      enabled: ${BANK_LOGGING_LOKI_ENABLED:true}
    logstash:
      enabled: ${BANK_LOGGING_LOGSTASH_ENABLED:false}
  rate-limiting:
    enabled: true
    fail-open: true
  iam:
    redis:
      enabled: true
  payments:
    redis-idempotency: true
  notifications:
    dev-redirect-email: ${BANK_NOTIFICATIONS_DEV_REDIRECT_EMAIL:}

# PostgreSQL profile — set SPRING_DATASOURCE_* (and optional BANK_*) via environment or .env (no secrets in Git).
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    locations: classpath:db/migration,classpath:db/postgresql/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
    username: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
    password: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

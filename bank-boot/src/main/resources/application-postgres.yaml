# PostgreSQL profile — set SPRING_DATASOURCE_* (and optional BANK_*) via environment or .env (no secrets in Git).
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    locations: classpath:db/migration,classpath:db/postgresql/migration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/at_bank}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:fedoraadmin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

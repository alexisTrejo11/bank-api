spring:
  application:
    name: bank
  profiles:
    default: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in .env}
    username: ${SPRING_DATASOURCE_USERNAME:?Set SPRING_DATASOURCE_USERNAME in .env}
    password: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:?Set SPRING_DATA_REDIS_HOST in .env}
      port: ${SPRING_DATA_REDIS_PORT:?Set SPRING_DATA_REDIS_PORT in .env}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:?Set SPRING_KAFKA_BOOTSTRAP_SERVERS in .env}
    admin:
      fail-fast: true
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:?Set SPRING_KAFKA_CONSUMER_GROUP_ID in .env}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    io.github.alexistrejo11.bank: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework: WARN
    org.apache.kafka: WARN
    com.zaxxer.hikari: WARN
    com.tngtech.archunit: ERROR
    io.netty: WARN

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:?Set MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE in .env}
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
    kafka:
      enabled: true

# See .env.example — use BANK_* / SPRING_* environment variables (or a repo-root .env file).
bank:
  security:
    jwt:
      private-key-pem: ${BANK_SECURITY_JWT_PRIVATE_KEY_PEM:}
      public-key-pem: ${BANK_SECURITY_JWT_PUBLIC_KEY_PEM:}
  http:
    cors:
      allowed-origins: []
  iam:
    redis:
      enabled: false
  payments:
    redis-idempotency: false
  loans:
    internal-funding-account-id: ${BANK_LOANS_INTERNAL_FUNDING_ACCOUNT_ID:aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa}
  notifications:
    dev-redirect-email: ${BANK_NOTIFICATIONS_DEV_REDIRECT_EMAIL:}
    stub-sms-e164: ${BANK_NOTIFICATIONS_STUB_SMS_E164:+15555550100}
    kafka:
      dispatch-topic: ${BANK_NOTIFICATIONS_KAFKA_DISPATCH_TOPIC:bank.notifications.dispatch}
      pipeline-topic: ${BANK_NOTIFICATIONS_KAFKA_PIPELINE_TOPIC:bank.notifications.pipeline}
  logging:
    file:
      directory: ${BANK_LOGGING_DIRECTORY:logs}
      max-file-size-mb: ${BANK_LOGGING_MAX_FILE_SIZE_MB:50}
      max-history-days: ${BANK_LOGGING_MAX_HISTORY_DAYS:14}
      total-size-cap-mb: ${BANK_LOGGING_TOTAL_SIZE_CAP_MB:500}
    loki:
      url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}
      enabled: ${BANK_LOGGING_LOKI_ENABLED:true}
    logstash:
      enabled: ${BANK_LOGGING_LOGSTASH_ENABLED:false}
      host: ${LOGSTASH_HOST:logstash}
      port: ${LOGSTASH_PORT:5044}
    access:
      enabled: ${BANK_LOGGING_ACCESS_ENABLED:true}
    levels:
      sql-debug: ${BANK_LOGGING_SQL_DEBUG:false}
  rate-limiting:
    enabled: false
    fail-open: true
    global:
      capacity: 64
      refill-per-second: 1.0
    profiles:
      standard:
        capacity: 48
        refill-per-second: 0.8
      strict:
        capacity: 12
        refill-per-second: 0.2
      sensitive_operations:
        capacity: 6
        refill-per-second: 0.1

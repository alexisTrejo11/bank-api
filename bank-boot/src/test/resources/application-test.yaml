spring:
  datasource:
    url: jdbc:h2:mem:banktest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    admin:
      fail-fast: true
    consumer:
      group-id: bank-test
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # H2 tests: skip PostgreSQL-only migrations (e.g. PL/pgSQL triggers under db/migration/postgresql).
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false
    kafka:
      enabled: true

bank:
  logging:
    loki:
      enabled: false
      url: ""
    logstash:
      enabled: false
    access:
      enabled: false
  rate-limiting:
    enabled: false
  http:
    cors:
      allowed-origins: []
  iam:
    redis:
      enabled: false
  payments:
    redis-idempotency: false
  loans:
    internal-funding-account-id: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
  notifications:
    dev-redirect-email: ""
    stub-sms-e164: "+15555550100"
    kafka:
      dispatch-topic: bank.notifications.dispatch
      pipeline-topic: bank.notifications.pipeline
